[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYsolid"
version = "0.1.0"
description = "Small upstream-backed three-dimensional linear elastic solid adapter"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
skfem = ["scikit-fem>=12.0.2,<13"]
test = ["pytest>=8,<10", "threadpoolctl>=3,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
